apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: bfsi-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:2.13.0
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --default-artifact-root=s3://$(MLFLOW_BUCKET)/artifacts
            - --backend-store-uri=$(DATABASE_URL)
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bfsi-secrets
                  key: database-url
            - name: MLFLOW_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: bfsi-config
                  key: mlflow-bucket
            - name: AWS_DEFAULT_REGION
              value: "ap-south-1"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-svc
  namespace: bfsi-prod
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
