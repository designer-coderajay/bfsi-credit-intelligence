version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_started }

  bureau-mcp:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    ports: ["9001:9001"]
    env_file: .env
    command: python -m backend.mcp_servers.bureau_mcp.server

  rbi-compliance-mcp:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    ports: ["9004:9004"]
    env_file: .env
    command: python -m backend.mcp_servers.rbi_compliance_mcp.server

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    ports: ["5000:5000"]
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --host 0.0.0.0 --backend-store-uri /mlflow --default-artifact-root /mlflow/artifacts

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bfsi_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bfsi_credit
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfsi_user"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on: [zookeeper]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  postgres_data:
  mlflow_data:
