name: BFSI Credit Intelligence CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Run Tests & Security Scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bfsi_test
          POSTGRES_USER: bfsi_user
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --break-system-packages -r requirements.txt
          pip install --break-system-packages pytest pytest-asyncio pytest-cov httpx

      - name: Run Bandit security scan
        run: |
          pip install bandit --break-system-packages
          bandit -r backend/ -ll --exit-zero

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://bfsi_user:testpassword@localhost:5432/bfsi_test
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENCRYPTION_KEY: "test_encryption_key_32_bytes_123"
          ENVIRONMENT: test
        run: |
          pytest tests/ -v \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -f infra/docker/backend.Dockerfile -t bfsi-scan:latest .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bfsi-scan:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build \
            -f infra/docker/backend.Dockerfile \
            -t $ECR_REGISTRY/bfsi-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/bfsi-backend:latest \
            .
          docker push $ECR_REGISTRY/bfsi-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/bfsi-backend:latest

      - name: Build and push frontend
        run: |
          docker build \
            -f infra/docker/frontend.Dockerfile \
            -t $ECR_REGISTRY/bfsi-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/bfsi-frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/bfsi-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/bfsi-frontend:latest

  deploy:
    name: Deploy to EKS (Mumbai)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name bfsi-eks-production --region $AWS_REGION

      - name: Deploy backend
        run: |
          kubectl set image deployment/bfsi-backend \
            backend=$ECR_REGISTRY/bfsi-backend:$IMAGE_TAG \
            -n bfsi-prod
          kubectl rollout status deployment/bfsi-backend -n bfsi-prod --timeout=5m

      - name: Deploy frontend
        run: |
          kubectl set image deployment/bfsi-frontend \
            frontend=$ECR_REGISTRY/bfsi-frontend:$IMAGE_TAG \
            -n bfsi-prod
          kubectl rollout status deployment/bfsi-frontend -n bfsi-prod --timeout=3m

      - name: Smoke test
        run: |
          BACKEND_URL=$(kubectl get svc bfsi-backend-svc -n bfsi-prod -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f http://$BACKEND_URL/health/ready || exit 1
          echo "✅ Deployment smoke test passed"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "🚨 BFSI deployment FAILED for commit ${{ github.sha }} by ${{ github.actor }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
