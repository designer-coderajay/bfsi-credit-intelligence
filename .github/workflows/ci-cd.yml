name: BFSI Credit Intelligence CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bfsi_test
          POSTGRES_USER: bfsi_user
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx flake8
          pip install -r requirements.txt || true

      - name: Lint (syntax errors + undefined names only)
        run: |
          flake8 backend/ tests/ \
            --select=E9,F63,F7,F82 \
            --count --show-source --statistics

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://bfsi_user:testpassword@localhost:5432/bfsi_test
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: sk-ant-ci-dummy-key-not-real
          ENCRYPTION_KEY: "test_encryption_key_32bytes_paddd"
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
          MLFLOW_TRACKING_URI: "sqlite:///mlflow_test.db"
        run: |
          pytest tests/ -v \
            --tb=short \
            -p no:warnings \
            --asyncio-mode=auto \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=40
